# Entity Resolver configuration — Compound blocking rule (country + city AND)
# For Group 2, Exp F: blocking on both country AND city.
# This creates tight blocks (city-level granularity within a country).
# Trade-off: fewer pairs per call, but risk of recall loss for cross-city variants.

cache_strategy: tf_incremental

threshold: 0.5

top_n: 100

match_weight_threshold: -10

splink:
  probability_two_random_records_match: 0.3

  comparisons:
    - type: jaro_winkler
      field: legal_name
      thresholds: [0.9, 0.8]

  # Compound blocking rule: a pair is compared only if both country_code AND city match.
  # This is expressed as a list with two fields.
  blocking_rules:
    - [country_code, city]
