# Docker Compose configuration for local development

name: ere-local

services:
  redis:
    image: redis:7-alpine
    container_name: "redis"
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli --no-auth-warning -a $REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
    networks:
      - ere-net

  redisinsight:
    image: redis/redisinsight:3.2.0
    container_name: "redisinsight"
    restart: unless-stopped
    ports:
      - "5540:5540"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5540/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ere-net

  ere:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: "ere"
    env_file: .env
    restart: unless-stopped
    environment:
      - DUCKDB_PATH=${DUCKDB_PATH:-/data/app.duckdb}
      - RDF_MAPPING_PATH=/app/config/rdf_mapping.yaml
      - RESOLVER_CONFIG_PATH=/app/config/resolver.yaml
      # Remaining REDIS_* and queue vars inherited from env_file
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /proc/1/cmdline"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ere-data:/data
    develop:
      watch:
        - action: sync
          path: ../src
          target: /app/src
        - action: sync
          path: ../config
          target: /app/config
        - action: rebuild
          path: ../pyproject.toml
        - action: rebuild
          path: ../poetry.lock
    networks:
      - ere-net

volumes:
  ere-data:

networks:
  ere-net:
