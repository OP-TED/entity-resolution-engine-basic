# Entity Resolver configuration — Standard blocking (single-field: country_code)

# DuckDB database configuration
duckdb:
  type: in-memory  # Options: "in-memory" or "persistent"
#  path: data/app.duckdb  # Default path for persistent mode (overridden by DUCKDB_PATH env var)

cache_strategy: tf_incremental

# Cluster assignment threshold: a mention joins an existing cluster only if
# match_probability >= threshold. Calibrate based on your trained model output.
# Typical range: 0.4–0.7 depending on prior and dataset characteristics.
# NOTE: With cold-start parameters and moderate JW similarity (0.8-0.9),
# scores around 0.17 are expected. Lower threshold to 0.15 to accept these matches.
threshold: 0.15

# Maximum cluster references returned per resolve_request() call.
top_n: 100

# Lower bound on match weight passed to find_matches_to_new_records().
# Controls which scored pairs are stored in the similarities table.
# -10 includes pairs with match_probability >= ~0.001, which captures
# below-THR mention-links needed for full genCand output (bridge case).
# Raise toward -4 to reduce storage costs on large datasets once
# below-THR links are confirmed to be above that floor.
match_weight_threshold: -10

# Automatic training threshold: mention count at which to trigger non-blocking
# background training. Set to 0 to disable auto-training.
# Default: 50 mentions triggers training in a daemon thread.
auto_train_threshold: 50

splink:
  # Prior probability that any two randomly selected records are a match.
  # This is the Fellegi-Sunter prior λ. Tune for your dataset:
  #   - High duplicate rate (deduplication): 0.1–0.3
  #   - Low duplicate rate (linking two clean datasets): 0.001–0.01
  # With too low a prior, EM converges to a local minimum where nothing matches.
  # probability_two_random_records_match: 0.0000022
  probability_two_random_records_match: 0.0022

  # Identity Function: fields and similarity functions used for pairwise scoring.
  # country_code is intentionally absent from comparisons — it is used only
  # as a blocking rule. Adding it as a comparison would prevent EM from training
  # its m-probabilities (since blocking only exposes same-country pairs).
  comparisons:
    - type: jaro_winkler
      field: legal_name
      thresholds: [0.9, 0.8]
    - type: exact_match
      field: country_code

  # Blocking rules: a pair is compared only if at least one rule fires.
  # Expressed as field names; multi-field rules use a list, e.g. [field1, field2].
  blocking_rules:
    - country_code

  # Cold-start default m/u probabilities (used before EM training).
  # Each field gets probability distributions for each comparison level.
  # For JaroWinklerAtThresholds [0.9, 0.8]: high, medium, low similarity.
  # For ExactMatch: match, no-match.
  # Once EM training completes, trained parameters overwrite these.
  cold_start:
    comparisons:
      legal_name:
        # JaroWinkler [0.9, 0.8]: high / medium / else
        # Adjusted: medium tier m_prob increased from 0.10 to 0.40
        # Rationale: moderate JW similarity (0.8-0.9) is meaningful for company names
        # Likelihood ratio for medium tier: 0.40 / 0.05 = 8.0 (vs 0.10 / 0.05 = 2.0)
        m_probabilities: [0.9, 0.6, 0.025, 0.005]
        u_probabilities: [0.00001, 0.0004, 0.004, 0.99559]
      country_code:
        # ExactMatch: match / else
        m_probabilities: [0.99, 0.01]
        u_probabilities: [0.10, 0.90]
