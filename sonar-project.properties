# SonarCloud Configuration for Entity Resolution Engine (ERE)
# ===========================================================
# This file configures quality gates and analysis for SonarCloud.
# See: https://docs.sonarcloud.io/

#-----------------------------------------------------------------------------
# Project Identity
#-----------------------------------------------------------------------------

# Must be unique in SonarCloud instance
sonar.projectKey=meaningfy-ws_entity-resolution-engine-basic
sonar.organization=meaningfy-ws

# Display name and version
sonar.projectName=Entity Resolution Engine (ERE)
sonar.projectVersion=1.0.0

#-----------------------------------------------------------------------------
# Code Analysis Paths
#-----------------------------------------------------------------------------

# Source code location (relative to sonar-project.properties)
sonar.sources=src
sonar.tests=test

# Source encoding
sonar.sourceEncoding=UTF-8

# Python version (must match pyproject.toml requires-python)
sonar.python.version=3.12

#-----------------------------------------------------------------------------
# Coverage & Test Report Paths
#-----------------------------------------------------------------------------

# Coverage report (generated by pytest-cov via tox)
sonar.python.coverage.reportPaths=coverage.xml

# Test results report (if using XML format)
sonar.python.xunit.reportPath=test-results.xml

# Pylint report (optional, for additional insights)
sonar.python.pylint.reportPath=pylint-report.txt

#-----------------------------------------------------------------------------
# Exclusions (don't analyze these)
#-----------------------------------------------------------------------------

# Exclude test files from coverage metrics
sonar.coverage.exclusions=test/**/*,setup.py,**/__init__.py

# Exclude test files from duplication detection
sonar.cpd.exclusions=test/**/*

# Exclude documentation and config files from analysis
sonar.exclusions=docs/**/*,*.md,infra/**/*

#-----------------------------------------------------------------------------
# SOLID Principles & Clean Code Quality Gates
#-----------------------------------------------------------------------------

# Single Responsibility Principle (SRP)
# Cognitive complexity per function (max 15 is recommended)
sonar.python.S3776.threshold=15

# Cyclomatic complexity per function (max 10 is good practice)
sonar.python.S1541.threshold=10

# Max lines per function (enforce small, focused functions)
sonar.python.S104.max=50

# Max lines per class (enforce focused classes)
sonar.python.S1188.max=500

# Open/Closed Principle (OCP)
# Discourage too many conditional statements (suggests need for polymorphism)
sonar.python.S1066.max=3

# Liskov Substitution Principle (LSP)
# Limit inheritance depth to avoid deep hierarchies
sonar.python.S110.max=4

# Don't Repeat Yourself (DRY) - Related to SOLID
# Minimum duplicate lines to trigger an issue
sonar.cpd.python.minimumLines=3

# Minimum duplicate tokens
sonar.cpd.python.minimumTokens=50

#-----------------------------------------------------------------------------
# Quality Gate Configuration
#
# Note: These conditions must also be configured in SonarCloud UI under:
#   Organization Settings → Quality Gates → Create "ERE SOLID Gate"
#
# Create custom quality gate with these conditions on New Code:
#   - Critical Issues: is greater than 0 → FAIL
#   - Blocker Issues: is greater than 0 → FAIL
#   - Security Hotspots Reviewed: is less than 100% → FAIL
#   - Coverage: is less than 80% → FAIL
#   - Duplicated Lines: is greater than 3% → FAIL
#   - Code Smells: is greater than 0 → FAIL (optional)
#
#-----------------------------------------------------------------------------

# Wait for quality gate result (useful in CI)
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Branch analysis configuration
sonar.branch.autoconfig.disabled=false

#-----------------------------------------------------------------------------
# Maintainability & Code Quality Thresholds
#
# Rating scale:
#   A = tech debt ratio <= 5%
#   B = tech debt ratio 6-10%
#   C = tech debt ratio 11-20%
#
#-----------------------------------------------------------------------------

# Enforce at least B rating
sonar.maintainability.rating.threshold=B

# New code should have zero code smells (potential issues)
sonar.newCode.codeSmells=0

# Overall complexity threshold for functions
sonar.complexity.threshold=10

#-----------------------------------------------------------------------------
# Reporting
#-----------------------------------------------------------------------------

# Generate reports for historical tracking
sonar.report.export.path=sonar-report

# Verbose logging (helpful for debugging)
sonar.verbose=false
