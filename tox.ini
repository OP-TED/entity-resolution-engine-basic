# tox configuration for CI/CD environment orchestration
# =====================================================
# tox manages isolated Python environments for reproducible, dependency-locked test runs.
#
# Three-environment model (matches Cosmic Python / Clean Code principles):
#   py312      - Unit tests + coverage analysis
#   architecture - Layer contract validation (import-linter)
#   clean-code - Code quality checks (pylint + radon + xenon)
#
# Use: tox -e py312,architecture,clean-code (in CI)
# For local development, use: make test-unit (faster, uses your venv)

[tox]
isolated_build = True
envlist = py312, architecture, clean-code
skip_missing_interpreters = True
package_root = src

[testenv]
description = Base environment configuration
passenv =
    HOME
    PYTHONPATH
    PYTHON*
    REDIS_HOST
    REDIS_PORT
    REDIS_PASSWORD
setenv =
    PYTHONPATH = {toxinidir}/src
allowlist_externals =
    poetry
commands_pre =
    poetry -C {toxinidir}/src sync

#=============================================================================
# py312: Unit Tests + Coverage
#=============================================================================

[testenv:py312]
description = Run unit tests with coverage analysis
commands =
    pytest test -m "not integration" \
        --cov={toxinidir}/src/ere \
        --cov-report=term \
        --cov-report=term-missing:skip-covered \
        --cov-report=xml:{toxinidir}/coverage.xml \
        -v \
        {posargs}

[coverage:run]
branch = True
source = src/ere

[coverage:report]
precision = 2
show_missing = True
skip_empty = True
sort = Cover
exclude_lines =
    pragma: no cover
    def __repr__
    if self\.debug
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:

# Fail if coverage is below 80%
fail_under = 80

[coverage:xml]
output = coverage.xml
# Note: actual output path is set explicitly via --cov-report=xml:{toxinidir}/coverage.xml

#=============================================================================
# pytest: Shared Configuration
#=============================================================================

[pytest]
testpaths = test
python_files = test_*.py
python_functions = test_*
addopts = -v --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests

#=============================================================================
# architecture: Layer Contract Validation (Cosmic Python)
#=============================================================================

[testenv:architecture]
description = Validate architectural boundaries (import-linter / Cosmic Python)
deps = import-linter>=2.3
commands =
    lint-imports

#=============================================================================
# clean-code: Code Quality (SOLID Principles)
#=============================================================================

[testenv:clean-code]
description = Code quality checks: pylint (style) + radon (complexity) + xenon (enforcement)
deps =
    pylint>=3.3.4
    radon>=6.0.1
    xenon>=0.9.3
commands =
    # Pylint: Check code style, naming conventions, SOLID principles
    pylint --rcfile=.pylintrc src/ere/ test/

    # Radon: Cyclomatic Complexity - show report
    radon cc src/ere/ -a --total-average --show-complexity

    # Radon: Maintainability Index - higher is better (A=best, C=worst)
    radon mi src/ere/ --show --sort

    # Xenon: Enforce complexity thresholds and fail if exceeded
    # A = 1-5 (simple), B = 6-10 (manageable), C = 11-20 (complex)
    xenon src/ere/ \
        --max-absolute C \
        --max-modules C \
        --max-average B \
        --exclude "*test*,*__pycache__*"
